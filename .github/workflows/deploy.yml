name: Roq Site Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          # Le site est servi à la racine de www.ditchbridge.fr (Scaleway S3) :
          # sans ce paramètre, l'action utilise l'URL GitHub Pages et préfixe
          # tous les liens par /fr-ditchbridge-www/.
          site-url: https://www.ditchbridge.fr/
          github-pages: false
      - name: Sync to Scaleway S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          ENDPOINT="https://s3.fr-par.scw.cloud"
          BUCKET="s3://${{ secrets.S3_SCW_BUCKET_ID }}"
          aws s3 sync target/roq/ "$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --delete

