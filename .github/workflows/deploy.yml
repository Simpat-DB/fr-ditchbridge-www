name: Roq Site Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync to Scaleway S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          ENDPOINT="https://s3.fr-par.scw.cloud"
          BUCKET="s3://${{ secrets.S3_SCW_BUCKET_ID }}"
          aws s3 sync target/roq/ "$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --delete
          aws s3 sync target/roq/ "$BUCKET/fr-ditchbridge-www/" \
            --endpoint-url "$ENDPOINT"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
