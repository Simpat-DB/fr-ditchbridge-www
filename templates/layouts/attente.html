---
layout: default
---

<style>
  @keyframes db-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .db-pulse-dot { animation: none !important; } }
</style>

<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:52vh; padding:4rem 1.5rem; text-align:center;">

  <!-- Arch motif -->
  <div style="width:80px;height:80px;margin-bottom:2rem;" aria-hidden="true">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;filter:drop-shadow(0 6px 18px rgba(77,34,168,0.15))">
      <rect width="100" height="100" rx="6" fill="#4D22A8"/>
      <ellipse cx="50" cy="100" rx="38" ry="52" fill="var(--color-surface-2)"/>
    </svg>
  </div>

  <!-- Status pill -->
  <span style="display:inline-flex;align-items:center;gap:0.45rem;font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-500);background:rgba(77,34,168,0.07);border:1px solid rgba(77,34,168,0.2);border-radius:2rem;padding:0.3rem 0.9rem;margin-bottom:1.25rem;">
    <span class="db-pulse-dot" style="width:5px;height:5px;border-radius:50%;background:var(--color-accent-500);animation:db-pulse 2s ease-in-out infinite;flex-shrink:0;" aria-hidden="true"></span>
    En cours de déploiement
  </span>

  <!-- Heading -->
  <h1 style="font-family:var(--font-display);font-size:clamp(1.4rem,3vw,1.85rem);font-weight:700;line-height:1.25;color:var(--color-primary);margin-bottom:1rem;text-wrap:balance;max-width:22ch;">
    Cette page est en cours de construction.
  </h1>
  <p style="font-size:0.975rem;line-height:1.7;color:var(--color-secondary);max-width:40ch;margin-bottom:2.5rem;text-wrap:balance;">
    Revenez bientôt — en attendant, retrouvez-nous sur les autres pages du site ou écrivez-nous directement.
  </p>

  <!-- Orange separator -->
  <div style="width:2rem;height:3px;background:var(--color-orange);border-radius:2px;margin:0 auto 2.5rem;" aria-hidden="true"></div>

  <!-- Links -->
