<header class="site-header">
  <div class="header-inner">
    <!-- Logo -->
    <a href="{site.url.relative}" class="header-logo">
      Ditch<span>bridge</span>
    </a>

    <!-- Mobile Menu Button -->
    <button id="mobile-menu-button" class="nav-item" aria-label="Menu">
      <span class="icon icon-menu"></span>
    </button>

    {#fragment id=menu}
    {@java.lang.String device = 'desktop'}
    <!-- Navigation -->
    <div class="{device == 'desktop' ? 'desktop-nav' : 'mobile-nav hidden'}">
      <nav>
        {#for item in site.data.navigation}
        <a href="{site.url.resolve(item.url)}" class="nav-item">
          {item.title}
        </a>
        {/for}
        {#for social in site.data.social??}
        <a href="{social.link}" class="nav-social" target="_blank" rel="noopener noreferrer" aria-label="{social.name}" title="{social.name}">
          <span class="icon icon-{social.icon}"></span>
          {#if device == 'mobile'}<span id="theme-text">{social.name}</span>{/if}
        </a>
        {/for}
      </nav>

      <!-- Language Switcher -->
      <span class="lang-switcher">
        <a id="lang-fr" href="{site.url.resolve('/')}" class="lang-active" title="Version française">FR</a>
        <span style="opacity:0.4;">/</span>
        <a id="lang-en" href="{site.url.resolve('/en/')}" title="English version">EN</a>
      </span>

      <!-- Theme Toggle -->
      <button class="nav-item theme-toggle" aria-label="Toggle theme">
        <span class="hidden toggle-light icon icon-sun"></span>
        <span class="hidden toggle-dark icon icon-moon"></span>
        {#if device == 'mobile'}<span class="theme-text">LIGHT MODE</span>{/if}
      </button>
    </div>
    {/fragment}
  </div>
  {#include $menu device='mobile'/}
</header>

<script>
// Highlight active language based on current URL
(function() {
  const path = window.location.pathname;
  const isEn = path.includes('/en/') || path.endsWith('/en');
  const frEl = document.getElementById('lang-fr');
  const enEl = document.getElementById('lang-en');
  if (!frEl || !enEl) return;
  if (isEn) {
    frEl.classList.remove('lang-active');
    enEl.classList.add('lang-active');
  } else {
    enEl.classList.remove('lang-active');
    frEl.classList.add('lang-active');
  }
})();
</script>
