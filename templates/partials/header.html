<header class="site-header">
  <div class="header-inner">
    <!-- Logo -->
    <a href="{site.url.relative}" class="header-logo">
      Ditch<span>Bridge</span>
    </a>

    <!-- Mobile Menu Button -->
    <button id="mobile-menu-button" class="nav-item" aria-label="Menu">
      <span class="icon icon-menu"></span>
    </button>

    {#fragment id=menu}
    {@java.lang.String device = 'desktop'}
    <!-- Navigation -->
    <div class="{device == 'desktop' ? 'desktop-nav' : 'mobile-nav hidden'}">
      <nav>
        {#for item in site.data.navigation}
        <a href="{site.url.resolve(item.url)}" class="nav-item">
          {item.title}
        </a>
        {/for}
        {#for social in site.data.social??}
        <a href="{social.link}" class="nav-social" target="_blank" rel="noopener noreferrer" aria-label="{social.name}" title="{social.name}">
          <span class="icon icon-{social.icon}"></span>
          {#if device == 'mobile'}<span id="theme-text">{social.name}</span>{/if}
        </a>
        {/for}
      </nav>

      <!-- Language Switcher -->
      <a id="lang-switcher" href="#" class="lang-switcher" title="Switch language" onclick="switchLang(event)">
        <span id="lang-fr" class="lang-active">FR</span>
        <span style="opacity:0.4;">/</span>
        <span id="lang-en">EN</span>
      </a>

      <!-- Theme Toggle -->
      <button class="nav-item theme-toggle" aria-label="Toggle theme">
        <span class="hidden toggle-light icon icon-sun"></span>
        <span class="hidden toggle-dark icon icon-moon"></span>
        {#if device == 'mobile'}<span class="theme-text">LIGHT MODE</span>{/if}
      </button>
    </div>
    {/fragment}
  </div>
  {#include $menu device='mobile'/}
</header>

<script>
// Language switcher
(function() {
  const lang = localStorage.getItem('lang') || 'fr';
  updateLangDisplay(lang);
})();

function updateLangDisplay(lang) {
  const fr = document.getElementById('lang-fr');
  const en = document.getElementById('lang-en');
  if (!fr || !en) return;
  if (lang === 'en') {
    fr.classList.remove('lang-active');
    en.classList.add('lang-active');
  } else {
    en.classList.remove('lang-active');
    fr.classList.add('lang-active');
  }
}

function switchLang(e) {
  e.preventDefault();
  const current = localStorage.getItem('lang') || 'fr';
  const next = current === 'fr' ? 'en' : 'fr';
  localStorage.setItem('lang', next);
  updateLangDisplay(next);

  // Redirect to /en/ prefix or back to root
  const path = window.location.pathname;
  if (next === 'en') {
    if (!path.startsWith('/en')) {
      const enPath = '/en' + (path === '/' ? '/' : path);
      window.location.href = enPath;
    }
  } else {
    if (path.startsWith('/en')) {
      window.location.href = path.replace(/^\/en/, '') || '/';
    }
  }
}
</script>
